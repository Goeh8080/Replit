name: Android APK

on:
  push:
    branches: [main, master]
  workflow_dispatch:

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - uses: android-actions/setup-android@v3

      - name: Install
        run: npm ci

      - name: Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager --install "platforms;android-36" "build-tools;36.0.0" "ndk;27.1.12297006"

      - name: Build release APK
        working-directory: android
        run: |
          chmod +x ./gradlew
          if [ -n "${ANDROID_HOME:-}" ]; then
            export ANDROID_NDK_HOME="$ANDROID_HOME/ndk/27.1.12297006"
          fi
          ./gradlew assembleRelease --no-daemon --stacktrace -PreactNativeArchitectures=armeabi-v7a,arm64-v8a

      - uses: actions/upload-artifact@v4
        with:
          name: granth-prabandhan-apk
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error
