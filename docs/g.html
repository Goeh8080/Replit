<!DOCTYPE html>
<html lang="hi">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>ग्रंथ प्रबंधन</title>
  <style>
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; background: #fdf6e3; color: #4a2c0a; font-family: sans-serif; text-align: center; }
    a { display: inline-block; margin-top: 18px; background: #7b1f2e; color: #fff; text-decoration: none; padding: 14px 22px; border-radius: 999px; font-weight: 700; }
  </style>
</head>
<body>
  <div>
    <h1>ग्रंथ प्रबंधन</h1>
    <p>ऐप खुल रही है…</p>
    <a id="open" href="#">ऐप में खोलें</a>
  </div>
  <script>
    var query = location.search || "";
    var intent = "intent://open" + query + "#Intent;scheme=granth;package=com.wnm.granthprabandhan;end";
    var button = document.getElementById("open");
    button.href = intent;
    location.href = intent;
  </script>
</body>
</html>
